<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="background">
            <img src="media/bg-pattern-desktop.svg" alt="">
        </div>
        <div class="section">
            <div class="one">
                <div class="navbar">
                    <img src="media/logo.svg" alt="">
                </div>
                 <div class="mobile">
                    <img src="media/hero-mobile.jpg" alt="">
                </div>
                <div class="middle">
                    <h1>WE'RE <br>
                    COMING <br>
                    SOON</h1>
                    <p>
                        Hello fellow shoppers! We're currently building our new fashion store. Add you email below to say up-to-date with announcements and our launch deals.
                    </p>
                    <div class="input">
                    <input type="text" placeholder="Email Address">
                    <button type="submit">
                        <img src="media/icon-arrow.svg" alt="">
                    </button>
                </div>
                <div class="output">
                    
                </div>
                </div>
                
            </div>
            <div class="two">
                <img src="media/hero-desktop.jpg" alt="">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
