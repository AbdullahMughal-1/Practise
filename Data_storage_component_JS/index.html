<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="background">
            <img class="desktop" src="media/bg-desktop.png" alt="">
            <img class="mobile" src="media/bg-mobile.png" alt="">
        </div>
        <div class="box">
            <div class="one">
                <img src="media/logo.svg" alt="">
                <div class="icons">
                    <img src="media/icon-document.svg" alt="">
                    <img src="media/icon-folder.svg" alt="">
                    <img src="media/icon-upload.svg" alt="">
                </div>
            </div>
            <div class="two">
                <p class="para">You've used <span>815 GB</span> of your storage</p>
                <div class="bar">
                    <div class="innerbar">

                    </div>
                </div>
                <div class="storage">
                    <p>0 GB</p>
                    <p>1000 GB</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
