<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="card">
        <div class="Bio">
            <div class="pic">
                <img src="avatar-jessica.jpeg" alt="profile-pic">
            </div>

            <div class="text">
                <h2>
                    Jessica Randall
                </h2>

                <p class="loc">
                    London, United Kingdom
                </p>


                <p class="job">"Front-end developer and avid reader."</p>
            </div>

            <div class="links">
                <button class="github">Github</button>
                <button class="mentor">Frontend Mentor</button>
                <button class="linkedin">LinkedIn</button>
                <button class="twitter">Twitter</button>
                <button class="insta">Instagram</button>
            </div>


        </div>

    </div>


</body>

</html>
