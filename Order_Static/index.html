<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="section">
        <img class="banner" src="media/pattern-background-desktop.svg" alt="" />
        <img class="bannermobile" src="media/pattern-background-mobile.svg" alt="">
        <div class="main">
            <div class="card">
                <div class="uppersection">
                    <img src="media/illustration-hero.svg" alt="" />
                </div>
                <div class="lowersection">
                    <div class="title">
                        <h2>Order Summary</h2>
                    </div>
                    <div class="description">
                        <p>
                            you can now listen to millions of songs, audiobooks, and podcase
                            on any device anywhere you like!
                        </p>
                    </div>
                    <div class="pricesection">
                        <img src="media/icon-music.svg" alt="" />
                        <div class="plan">
                            <h3>Annual Plan</h3>
                            <p>$59.99/year</p>
                        </div>
                        <h4>Change</h4>
                    </div>
                    <div class="buttons">
                        <button class="Payment">Proceed to Payment</button>
                        <button>Cancel Order</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
