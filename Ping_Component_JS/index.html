<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="logo">
            <img src="media/logo.svg" alt="">
        </div>
        <div class="title">
            <h1>We are launching <span>soon!</span></h1>
            <p>Subscribe and get notified</p>
        </div>
        <div class="inputandbutton">
            <div class="input">
                <input id="input" type="text" placeholder="Your email address...">
                <p class="red">Please provide a valid email address</p>
            </div>
            <button class="notify">Notify Me</button>
        </div>
        <div class="skeleton">
            <img src="media/illustration-dashboard.png" alt="">
        </div>
        <div class="socialbutton">
            <div class="icons">
                  <div class="facebook">
                    <img src="media/facebook-1-svgrepo-com.svg" alt="">
            </div>
            <div class="twitter">
                <img src="media/twitter-color-svgrepo-com.svg" alt="">
            </div>
            <div class="insta">
                <img src="media/instagram-svgrepo-com.svg" alt="">
            </div>
            </div>
            <p>&copy Copyright Ping. All rights reserved.</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
