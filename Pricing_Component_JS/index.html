<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <div class="background">
            <img src="media/bg-pattern.svg" alt="">
        </div>

        <div class="top">
            <div class="upper">
                <div class="img">
                    <img src="media/pattern-circles.svg" alt="">
                </div>
                <h1>Simple, traffic-based pricing</h1>
                <p>Sign-up for our 30-day trial. No credit card required.</p>
            </div>
        </div>


        <div class="box">
            <div class="boxtop">
                <p id="pageviews-text">100K PAGEVIEW</p>
                <h1 id="price-text">$16.00 <span class="month"> / month</span></h1>
            </div>

            <div class="input">
                <input type="range" id="slider" min="0" max="4" step="1" value="2">
            </div>

            <div class="boxbutton">
                <div class="middleone">
                    <h4>Montlhy Billing
                    </h4>
                        <label class="switch">
                            <input type="checkbox" id="billing-toggle">
                            <span class="slider-track"></span>
                        </label>
                </div>

                <div class="middletwo">
                    <h4>Yearly Billing</h4>
                    <h3>25% discount</h3>
                </div>
            </div>

            <hr>

            <div class="bottom">
                <div class="bottomfirst">
                    <div class="one">
                        <img src="media/icon-check.svg" alt="">
                        <p>Unlimited websites</p>
                    </div>
                    <div class="two">
                        <img src="media/icon-check.svg" alt="">
                        <p>100% data ownership</p>
                    </div>
                    <div class="three">
                        <img src="media/icon-check.svg" alt="">
                        <p>Email reports</p>
                    </div>
                </div>

                <div class="bottomtwo">
                    <button>Start my trial</button>
                </div>
            </div>

        </div>


    </div>
    <script src="script.js"></script>
</body>

</html>
