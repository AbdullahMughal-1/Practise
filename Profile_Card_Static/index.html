<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main">
        <img class="img1" src="media/bg-pattern-top.svg" alt="">
        <img class="img2" src="media/bg-pattern-bottom.svg" alt="">
        <div class="card">
            <div class="card1">
                <div class="upper">
                    <img src="media/bg-pattern-card.svg" alt="">
                </div>
                
                <div class="img">
                    <img src="media/image-victor.jpg" alt="">
                </div>

                <div class="middle">
                    <div class="name">
                        <h2>Victor Crest</h2>
                        <h3>26</h3>
                    </div>
                    <p>London</p>
                </div>

                <div class="lower">
                    <hr>
                    <div class="clients">
                        <div class="one">
                            <h2>80K</h2>
                            <p>Followers</p>
                        </div>
                        <div class="two">
                            <h2>803K</h2>
                            <p>Likes</p>
                        </div>
                        <div class="three">
                            <h2>1.4K</h2>
                            <p>Photos</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
